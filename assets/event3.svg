<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="e3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061919" />
      <stop offset="60%" stop-color="#0c2b29" />
      <stop offset="100%" stop-color="#041212" />
    </linearGradient>
    <linearGradient id="emeraldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <pattern id="e3Grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(16, 185, 129, 0.09)" stroke-width="1" />
    </pattern>
    <filter id="e3Glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#e3Bg)" />
  <rect width="100%" height="100%" fill="url(#e3Grid)" />

  <!-- Ambient Emerald Light -->
  <circle cx="300" cy="180" r="150" fill="#10b981" opacity="0.14" />

  <!-- IoT Microcontroller & Cyber Interface Visual -->
  <g transform="translate(100, 40)">
    <!-- Circuit Board Base -->
    <rect width="400" height="270" rx="16" fill="rgba(6, 26, 26, 0.85)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />

    <!-- Central Microchip -->
    <rect x="140" y="70" width="120" height="120" rx="10" fill="#041b18" stroke="#10b981" stroke-width="2" filter="url(#e3Glow)" />
    <!-- Chip Pins -->
    <g fill="#34d399">
      <!-- Top Pins -->
      <rect x="155" y="58" width="6" height="12" rx="2" />
      <rect x="175" y="58" width="6" height="12" rx="2" />
      <rect x="195" y="58" width="6" height="12" rx="2" />
      <rect x="215" y="58" width="6" height="12" rx="2" />
      <rect x="235" y="58" width="6" height="12" rx="2" />

      <!-- Bottom Pins -->
      <rect x="155" y="190" width="6" height="12" rx="2" />
      <rect x="175" y="190" width="6" height="12" rx="2" />
      <rect x="195" y="190" width="6" height="12" rx="2" />
      <rect x="215" y="190" width="6" height="12" rx="2" />
      <rect x="235" y="190" width="6" height="12" rx="2" />

      <!-- Left Pins -->
      <rect x="128" y="85" width="12" height="6" rx="2" />
      <rect x="128" y="105" width="12" height="6" rx="2" />
      <rect x="128" y="125" width="12" height="6" rx="2" />
      <rect x="128" y="145" width="12" height="6" rx="2" />
      <rect x="128" y="165" width="12" height="6" rx="2" />

      <!-- Right Pins -->
      <rect x="260" y="85" width="12" height="6" rx="2" />
      <rect x="260" y="105" width="12" height="6" rx="2" />
      <rect x="260" y="125" width="12" height="6" rx="2" />
      <rect x="260" y="145" width="12" height="6" rx="2" />
      <rect x="260" y="165" width="12" height="6" rx="2" />
    </g>

    <!-- Inside Chip Logo -->
    <text x="200" y="125" font-family="'Poppins', sans-serif" font-size="14" font-weight="900" fill="#34d399" text-anchor="middle" letter-spacing="1">IoT &bull; CORE</text>
    <text x="200" y="145" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#00f2fe" text-anchor="middle">ESP32 / SENSOR</text>

    <!-- Radiating Antenna / WiFi Wave Signals -->
    <path d="M 50 130 A 60 60 0 0 1 110 70" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M 35 130 A 80 80 0 0 1 110 50" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.6" />

    <!-- Smart Cloud Signal Right -->
    <path d="M 350 130 A 60 60 0 0 0 290 70" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M 365 130 A 80 80 0 0 0 290 50" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.6" />

    <!-- Live Sensor Status Row -->
    <g transform="translate(40, 225)">
      <rect width="320" height="30" rx="8" fill="rgba(4, 20, 20, 0.8)" stroke="rgba(16, 185, 129, 0.3)" />
      <circle cx="20" cy="15" r="4" fill="#34d399" />
      <text x="35" y="20" font-family="'Courier New', monospace" font-size="11" fill="#a7f3d0" font-weight="700">MQTT: CONNECTED &bull; 2.4GHz &bull; TELEMETRY ACTIVE</text>
    </g>
  </g>

  <!-- Glowing Badge on bottom right -->
  <g transform="translate(420, 290)">
    <rect width="140" height="34" rx="17" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.2" />
    <text x="70" y="21" font-family="'Poppins', sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="1">EVENT 03 &bull; CREATIVE</text>
  </g>
</svg>
