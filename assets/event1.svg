<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="e1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e22" />
      <stop offset="60%" stop-color="#0f1938" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <pattern id="e1Grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 242, 254, 0.08)" stroke-width="1" />
    </pattern>
    <filter id="e1Glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#e1Bg)" />
  <rect width="100%" height="100%" fill="url(#e1Grid)" />

  <!-- Code Matrix Ambient Glow -->
  <circle cx="300" cy="180" r="140" fill="#00f2fe" opacity="0.12" />

  <!-- Futuristic Terminal Mockup -->
  <g transform="translate(100, 50)">
    <!-- Terminal Window Frame -->
    <rect width="400" height="260" rx="14" fill="rgba(8, 14, 32, 0.9)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5" />
    <!-- Window Header -->
    <path d="M 0 14 C 0 6 6 0 14 0 L 386 0 C 394 0 400 6 400 14 L 400 40 L 0 40 Z" fill="rgba(15, 26, 56, 0.85)" />
    <circle cx="25" cy="20" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="45" cy="20" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="65" cy="20" r="5" fill="#10b981" opacity="0.8" />
    <text x="200" y="24" font-family="'Poppins', monospace" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="600">code_matrix.py &bull; CSE DEV CONSOLE</text>

    <!-- Code Snippet Lines -->
    <g transform="translate(30, 75)" font-family="'Courier New', monospace" font-size="13" font-weight="600">
      <text x="0" y="0" fill="#a855f7">from</text>
      <text x="45" y="0" fill="#38bdf8">techfusion</text>
      <text x="135" y="0" fill="#a855f7">import</text>
      <text x="190" y="0" fill="#facc15">AutonomousAgent</text>

      <text x="0" y="28" fill="#64748b"># Flagship 24H Autonomous Code Odyssey</text>

      <text x="0" y="56" fill="#a855f7">def</text>
      <text x="35" y="56" fill="#00f2fe" filter="url(#e1Glow)">execute_hackathon</text>
      <text x="175" y="56" fill="#f8fafc">(team_id):</text>

      <text x="20" y="84" fill="#38bdf8">repo</text>
      <text x="60" y="84" fill="#f8fafc">=</text>
      <text x="75" y="84" fill="#a855f7">await</text>
      <text x="125" y="84" fill="#facc15">compile_solution</text>
      <text x="260" y="84" fill="#f8fafc">()</text>

      <text x="20" y="112" fill="#a855f7">return</text>
      <text x="75" y="112" fill="#10b981">"🏆 VICTORY &bull; SCORE 100/100"</text>

      <!-- Cursor -->
      <rect x="20" y="130" width="10" height="18" fill="#00f2fe" opacity="0.8" />
    </g>
  </g>

  <!-- Glowing Badge on bottom right -->
  <g transform="translate(430, 290)">
    <rect width="130" height="34" rx="17" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="1.2" />
    <text x="65" y="21" font-family="'Poppins', sans-serif" font-size="11" font-weight="800" fill="#00f2fe" text-anchor="middle" letter-spacing="1">EVENT 01 &bull; TECH</text>
  </g>
</svg>
