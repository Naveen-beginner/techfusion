<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a1a" />
      <stop offset="45%" stop-color="#0b122e" />
      <stop offset="80%" stop-color="#0d183d" />
      <stop offset="100%" stop-color="#050713" />
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.7" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
    </filter>

    <!-- Patterns -->
    <pattern id="bannerGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.07)" stroke-width="1" />
      <circle cx="40" cy="0" r="1.5" fill="rgba(0, 242, 254, 0.25)" />
    </pattern>

    <pattern id="hexDots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="rgba(129, 140, 248, 0.2)" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="24" />
  <rect width="100%" height="100%" fill="url(#bannerGrid)" rx="24" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="120" r="160" fill="#00f2fe" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="1020" cy="360" r="180" fill="#8b5cf6" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="600" cy="240" r="220" fill="#0284c7" opacity="0.08" filter="url(#softGlow)" />

  <!-- Outer Luminous Border -->
  <rect x="2" y="2" width="1196" height="476" rx="22" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- High-Tech Circuit Geometry Left -->
  <g opacity="0.45" stroke="#00f2fe" stroke-width="1.5" fill="none">
    <path d="M 60 80 L 140 80 L 180 120 L 260 120" />
    <circle cx="60" cy="80" r="4" fill="#00f2fe" />
    <circle cx="260" cy="120" r="3" fill="#00f2fe" />

    <path d="M 40 220 L 110 220 L 150 180 L 220 180 L 250 210 L 320 210" />
    <circle cx="40" cy="220" r="4" fill="#38bdf8" />
    <circle cx="320" cy="210" r="4" fill="#00f2fe" />

    <path d="M 80 380 L 160 380 L 210 330 L 290 330" />
    <circle cx="80" cy="380" r="4" fill="#00f2fe" />
    <circle cx="290" cy="330" r="3" fill="#818cf8" />
  </g>

  <!-- High-Tech Circuit Geometry Right -->
  <g opacity="0.45" stroke="#8b5cf6" stroke-width="1.5" fill="none">
    <path d="M 1140 80 L 1060 80 L 1020 120 L 940 120" />
    <circle cx="1140" cy="80" r="4" fill="#c084fc" />
    <circle cx="940" cy="120" r="3" fill="#8b5cf6" />

    <path d="M 1160 220 L 1090 220 L 1050 260 L 980 260 L 950 230 L 880 230" />
    <circle cx="1160" cy="220" r="4" fill="#8b5cf6" />
    <circle cx="880" cy="230" r="4" fill="#00f2fe" />

    <path d="M 1120 380 L 1040 380 L 990 330 L 910 330" />
    <circle cx="1120" cy="380" r="4" fill="#8b5cf6" />
    <circle cx="910" cy="330" r="3" fill="#00f2fe" />
  </g>

  <!-- Corner Brackets -->
  <g stroke="#00f2fe" stroke-width="3" fill="none" opacity="0.8">
    <path d="M 30 50 L 30 30 L 50 30" />
    <path d="M 1170 50 L 1170 30 L 1150 30" />
    <path d="M 30 430 L 30 450 L 50 450" />
    <path d="M 1170 430 L 1170 450 L 1150 450" />
  </g>

  <!-- Top Badge: College & Department -->
  <g transform="translate(600, 68)" text-anchor="middle">
    <!-- Badge Background -->
    <rect x="-290" y="-18" width="580" height="36" rx="18" fill="rgba(8, 24, 52, 0.85)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.2" />
    <circle cx="-266" cy="0" r="5" fill="#00f2fe" filter="url(#glow)" />
    <text x="-248" y="5" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2.5" text-anchor="start">R.V.R. &amp; J.C. COLLEGE OF ENGINEERING</text>
    <rect x="200" y="-10" width="70" height="20" rx="6" fill="rgba(0, 242, 254, 0.2)" />
    <text x="235" y="4" font-family="'Poppins', sans-serif" font-size="10" font-weight="800" fill="#00f2fe" letter-spacing="1.5">AUTONOMOUS</text>
  </g>

  <!-- Sub-Badge: INNOVEX 2026 -->
  <g transform="translate(600, 118)" text-anchor="middle">
    <text font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#a0a0b8" letter-spacing="4">INNOVEX 2026 &bull; NATIONAL TECHNICAL SYMPOSIUM</text>
  </g>

  <!-- Central Title: TECHFUSION -->
  <g transform="translate(600, 230)" text-anchor="middle">
    <!-- Shadow / Glow behind title -->
    <text x="0" y="0" font-family="'Poppins', 'Arial Black', sans-serif" font-size="82" font-weight="900" fill="#00f2fe" opacity="0.3" filter="url(#softGlow)" letter-spacing="6">TECHFUSION</text>
    <text x="0" y="0" font-family="'Poppins', 'Arial Black', sans-serif" font-size="82" font-weight="900" fill="url(#cyberCyan)" letter-spacing="6">TECHFUSION</text>
  </g>

  <!-- Department Designation -->
  <g transform="translate(600, 290)" text-anchor="middle">
    <rect x="-240" y="-16" width="480" height="34" rx="8" fill="rgba(17, 24, 54, 0.75)" stroke="rgba(139, 92, 246, 0.45)" stroke-width="1.2" />
    <text x="0" y="6" font-family="'Poppins', sans-serif" font-size="15" font-weight="800" fill="#e0e7ff" letter-spacing="3.5">DEPARTMENT OF CSE &amp; IoT</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(600, 345)" text-anchor="middle">
    <text font-family="'Poppins', sans-serif" font-size="16" font-style="italic" font-weight="400" fill="#cbd5e1" letter-spacing="1">"Where Code Meets Innovation &bull; Ideas Become Reality"</text>
  </g>

  <!-- Footer Pills inside Banner -->
  <g transform="translate(600, 410)" text-anchor="middle">
    <!-- Date Pill -->
    <g transform="translate(-200, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="rgba(10, 18, 42, 0.85)" stroke="rgba(0, 242, 254, 0.35)" />
      <text x="0" y="5" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#00f2fe" letter-spacing="1.5">📅 9th OCTOBER 2026</text>
    </g>
    <!-- Event Count Pill -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="rgba(10, 18, 42, 0.85)" stroke="rgba(129, 140, 248, 0.35)" />
      <text x="0" y="5" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#c084fc" letter-spacing="1.5">⚡ 3 FLAGSHIP EVENTS</text>
    </g>
    <!-- No Fee Pill -->
    <g transform="translate(200, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="rgba(10, 18, 42, 0.85)" stroke="rgba(16, 185, 129, 0.4)" />
      <text x="0" y="5" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#34d399" letter-spacing="1.5">🎟️ NO ENTRY FEE</text>
    </g>
  </g>
</svg>
