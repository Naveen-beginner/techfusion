<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="e2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110b24" />
      <stop offset="60%" stop-color="#1b1238" />
      <stop offset="100%" stop-color="#080514" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <pattern id="e2Grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(168, 85, 247, 0.09)" stroke-width="1" />
    </pattern>
    <filter id="e2Glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#e2Bg)" />
  <rect width="100%" height="100%" fill="url(#e2Grid)" />

  <!-- Ambient Purple Light -->
  <circle cx="300" cy="180" r="150" fill="#a855f7" opacity="0.14" />

  <!-- Neural Network & Algorithmic Graph Visual -->
  <g transform="translate(110, 40)">
    <!-- Main Frame -->
    <rect width="380" height="270" rx="16" fill="rgba(14, 10, 32, 0.85)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.5" />

    <!-- Node Lines -->
    <g stroke="rgba(192, 132, 252, 0.4)" stroke-width="2">
      <!-- Input layer to Hidden 1 -->
      <line x1="60" y1="70" x2="150" y2="50" />
      <line x1="60" y1="70" x2="150" y2="135" />
      <line x1="60" y1="135" x2="150" y2="50" />
      <line x1="60" y1="135" x2="150" y2="135" />
      <line x1="60" y1="135" x2="150" y2="220" />
      <line x1="60" y1="200" x2="150" y2="135" />
      <line x1="60" y1="200" x2="150" y2="220" />

      <!-- Hidden 1 to Hidden 2 -->
      <line x1="150" y1="50" x2="240" y2="80" />
      <line x1="150" y1="50" x2="240" y2="190" />
      <line x1="150" y1="135" x2="240" y2="80" />
      <line x1="150" y1="135" x2="240" y2="190" />
      <line x1="150" y1="220" x2="240" y2="80" />
      <line x1="150" y1="220" x2="240" y2="190" />

      <!-- Hidden 2 to Output -->
      <line x1="240" y1="80" x2="320" y2="135" stroke="#a855f7" stroke-width="2.5" />
      <line x1="240" y1="190" x2="320" y2="135" stroke="#a855f7" stroke-width="2.5" />
    </g>

    <!-- Nodes -->
    <!-- Input Layer -->
    <circle cx="60" cy="70" r="10" fill="#38bdf8" />
    <circle cx="60" cy="135" r="10" fill="#38bdf8" />
    <circle cx="60" cy="200" r="10" fill="#38bdf8" />

    <!-- Hidden 1 -->
    <circle cx="150" cy="50" r="12" fill="#818cf8" />
    <circle cx="150" cy="135" r="12" fill="#818cf8" />
    <circle cx="150" cy="220" r="12" fill="#818cf8" />

    <!-- Hidden 2 -->
    <circle cx="240" cy="80" r="13" fill="#a855f7" />
    <circle cx="240" cy="190" r="13" fill="#a855f7" />

    <!-- Output Core Node -->
    <circle cx="320" cy="135" r="18" fill="#c084fc" filter="url(#e2Glow)" />
    <circle cx="320" cy="135" r="8" fill="#ffffff" />

    <!-- Mathematical Formula Overlay -->
    <text x="190" y="252" font-family="'Poppins', sans-serif" font-size="12" fill="#e9d5ff" text-anchor="middle" font-weight="700" letter-spacing="1">f(x) = argmin &sum; L(&theta;) &bull; OPTIMAL STATE</text>
  </g>

  <!-- Glowing Badge on bottom right -->
  <g transform="translate(410, 290)">
    <rect width="150" height="34" rx="17" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1.2" />
    <text x="75" y="21" font-family="'Poppins', sans-serif" font-size="11" font-weight="800" fill="#c084fc" text-anchor="middle" letter-spacing="1">EVENT 02 &bull; INNOVATION</text>
  </g>
</svg>
